[platformio]
default_envs = tx


[env:tx]
platform = espressif32
board = esp32thing_plus
framework = arduino
monitor_speed = 115200

build_src_filter =
    +<TX_kontroll/main.cpp>
    +<InputManager.cpp>
    +<EspNowTx.cpp>
    +<WebServerManager.cpp>
    +<RouteStorage.cpp>

    -<RX_robot/*>
    -<RobotControl.cpp>
    -<EspNowRx.cpp>
    -<MotorDriver.cpp>
    -<WheelEncoders.cpp>
    -<SpeedTrim.cpp>


[env:rx]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv

build_src_filter =
    +<RX_robot/main.cpp>
    +<RobotControl.cpp>
    +<EspNowRx.cpp>
    +<MotorDriver.cpp>
    +<WheelEncoders.cpp>
    +<SpeedTrim.cpp>

    -<TX_kontroll/*>
    -<InputManager.cpp>
    -<EspNowTx.cpp>